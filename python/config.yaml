# 量化监控系统 - 业务配置
# 密钥全部在 .env 中，此文件只放非敏感的业务配置

# 数据库（相对路径，config.py 自动拼到项目根目录）
database:
  path: python/data/stock_data.db
  backup_dir: python/data/backup

# API 地址
api:
  sina_kline_url: https://quotes.sina.cn/cn/api/json_v2.php/CN_MarketDataService.getKLineData
  tencent_quote_url: http://qt.gtimg.cn/q=

# 策略参数
strategy:
  add_position_threshold: -0.20
  add_position_prob: 0.55
  max_add_ratio: 0.30
  min_intraday_range: 2.0
  t_profit_target: 1.5
  max_t_ratio: 0.33
  deep_loss_threshold: -0.15

# 关注股票列表
watchlist:
  - symbol: 9988.HK
    name: 阿里巴巴-W
  - symbol: 0700.HK
    name: 腾讯控股
  - symbol: 300124.SZ
    name: 汇川技术
  - symbol: 300015.SZ
    name: 爱尔眼科
  - symbol: 600048.SH
    name: 保利发展
  - symbol: 159792.SZ
    name: 港股通互联网ETF

# 定时任务
schedule:
  kline_accumulate: '*/30 9-15 * * 1-5'
  monitor: '*/30 9-15 * * 1-5'
  daily_update: '0 20 * * 1-5'