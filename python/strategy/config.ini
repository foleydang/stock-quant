# 策略配置文件

[stock_pool]
# 监控股票池
watchlist = 300015.SZ,300124.SZ,600048.SH,3690.HK

[strategy]
# 策略参数
rsi_oversold = 30
rsi_overbought = 70
macd_cross_threshold = 0.001
bb_breakout_threshold = 0.02
stop_loss_pct = 0.03
take_profit_pct = 0.05

[scheduler]
# 调度器配置
interval_minutes = 30
enabled = true

[notification]
# 通知配置
enabled = true
console = true
dingtalk = false
wechat = false
feishu = false
email = false

